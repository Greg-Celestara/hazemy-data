# Builds site/v1/hazemy.json, site/v2/hazemy.json and the optional site/v2/wind.json, and
# publishes them with GitHub Pages.
#
# Secrets (repo Settings -> Secrets and variables -> Actions): ADS_API_KEY, FIRMS_MAP_KEY.
# Pages must be set to "GitHub Actions" as its source (Settings -> Pages).
#
# Schedule: every 30 min, at :15 and :45. The 00 UTC CAMS run is published about 10:00 UTC, so
# the 10:15 run is the first that can see it; until then the job expects (and finds in its cache)
# the previous day's run. If CAMS is late, that run fails and the later runs retry.
# GitHub delays and drops scheduled runs under load (28 Oct 2026: about 5 of 24 :20 runs a day
# arrived, 8-90 min late), so cron-job.org also calls workflow_dispatch as the dependable trigger.
# :15/:45 keep clear of its :00 call; a run takes about 2 min. Each run refreshes the FIRMS
# fires and the "now" window. The CAMS downloads are cached per run day with fixed lead spans, so
# per run day the ADS is called once for the newest run and once for the previous run; the other
# runs cost a few MB of FIRMS and GFS traffic.
#
# A failed run never reaches the deploy job, so the last good file stays live.
#
# GFS: the 850 hPa wind and rain files are cached per 6-hourly cycle (cache-gfs), so each cycle is
# downloaded once. The newest saved snapshot is restored by prefix (hazemy-gfs-2...), the job
# prunes cycles older than it needs, and the snapshot is saved under a key built from the newest
# cycle actually present in the folder (hazemy-gfs-<cycle>-<run id>). The cache stays bounded by
# the job's pruning; GitHub also evicts the oldest snapshots.
#
# GitHub disables scheduled workflows after 60 days without repository activity; re-enable them
# under Actions -> HazeMY data if the published file stops updating.

name: HazeMY data

on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hazemy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Date of the expected CAMS run
        id: day
        # Same 10 h publish lag as PUBLISH_LAG_H in hazemy/cams.py.
        run: echo "day=$(date -u -d '-10 hours' +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore the CAMS download of that run
        uses: actions/cache@v4
        with:
          path: cache
          key: hazemy-cams-${{ steps.day.outputs.day }}
      - name: Restore the last FIRMS detections
        # After the CAMS restore on purpose: that archive may hold an older copy of this file.
        # Restored by prefix; the newest snapshot wins. Used only if under 24 h old.
        uses: actions/cache/restore@v4
        with:
          path: cache/firms_last.json
          key: hazemy-firms-restore-${{ github.run_id }}
          restore-keys: hazemy-firms-
      - name: Restore the last MetMalaysia forecast and warnings
        # Same pattern as FIRMS: newest snapshot by prefix, used only if under 24 h old.
        uses: actions/cache/restore@v4
        with:
          path: cache/met_last.json
          key: hazemy-met-restore-${{ github.run_id }}
          restore-keys: hazemy-met-
      - name: Restore the GFS downloads
        # No exact key exists on purpose: the newest saved snapshot is restored by prefix.
        uses: actions/cache/restore@v4
        with:
          path: cache-gfs
          key: hazemy-gfs-restore-${{ github.run_id }}
          restore-keys: hazemy-gfs-2
      - name: Build hazemy.json (v1 and v2)
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: >
          python -m hazemy --out site/v1/hazemy.json --out-v2 site/v2/hazemy.json
          --out-wind site/v2/wind.json --cache cache --gfs-cache cache-gfs
      - name: Build flood-spots.json
        # Never stops the main data files publishing.
        continue-on-error: true
        # Static list (data/flood_spots.json); no network. Fails the run if the list is invalid.
        run: python -m hazemy.flood_spots --out site/v2/flood-spots.json
      - name: Newest GFS cycle in the cache
        id: cycle
        # The cycle the job actually used (and kept after pruning), read from the file names
        # gfs_YYYYMMDDHH_fNNN_kind.grib, not guessed from the clock.
        run: |
          newest=$(ls cache-gfs 2>/dev/null | sed -n 's/^gfs_\([0-9]\{10\}\)_.*\.grib$/\1/p' | sort | tail -n 1)
          echo "cycle=${newest}" >> "$GITHUB_OUTPUT"
      - name: Save the GFS downloads
        if: steps.cycle.outputs.cycle != ''
        uses: actions/cache/save@v4
        with:
          path: cache-gfs
          key: hazemy-gfs-${{ steps.cycle.outputs.cycle }}-${{ github.run_id }}
      - name: Save the FIRMS detections
        # Unique key per run so the file is refreshed every hour (about 1.3 MB, one file).
        if: hashFiles('cache/firms_last.json') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/firms_last.json
          key: hazemy-firms-${{ github.run_id }}
      - name: Save the MetMalaysia forecast and warnings
        if: hashFiles('cache/met_last.json') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/met_last.json
          key: hazemy-met-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
